[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-paper-review"
version = "1.0.1"
description = "Local, evidence-linked scientific-method review and cross-manuscript evaluation with Ollama"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.26.5", "jsonschema==4.25.1"]

[project.scripts]
paper-review = "scientific_review.cli:main"

[tool.setuptools.packages.find]
include = ["scientific_review*"]

[tool.setuptools.package-data]
scientific_review = ["prompts/*.md", "schemas/*.json"]
